<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">Cyber Runner — High-Level System Architecture</title>
  <desc id="description">High-level view of users, local browser application, game and controls, optional camera input, local communication, persistence, and display and audio output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#7284a0"/></marker>
    <marker id="cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#42c9e8"/></marker>
    <marker id="violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#aa8cff"/></marker>
    <marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#66d6a0"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#edf3ff}
      .title{font-size:32px;font-weight:700}
      .sub{font-size:16px;fill:#9dacc4}
      .section{font-size:16px;font-weight:700;letter-spacing:1px}
      .head{font-size:19px;font-weight:700}
      .body{font-size:14px;fill:#bdc9dc}
      .small{font-size:12px;fill:#aebbd0}
      .box{fill:#111d2e;stroke:#354761;stroke-width:1.5}
      .card{fill:#19273c;stroke:#455a78;stroke-width:1.3}
      .line{fill:none;stroke:#7284a0;stroke-width:2;marker-end:url(#arrow)}
      .net{fill:none;stroke:#42c9e8;stroke-width:2.5;marker-end:url(#cyan)}
      .motion{fill:none;stroke:#aa8cff;stroke-width:2.5;marker-end:url(#violet)}
      .out{fill:none;stroke:#66d6a0;stroke-width:2.5;marker-end:url(#green)}
    </style>
  </defs>
  <rect width="1400" height="850" fill="#080e19"/>
  <text x="54" y="58" class="title">CYBER RUNNER — HIGH-LEVEL SYSTEM ARCHITECTURE</text>
  <text x="56" y="87" class="sub">A local browser game with optional camera-based movement controls</text>

  <!-- Users -->
  <rect x="55" y="330" width="225" height="145" rx="14" class="box"/>
  <text x="80" y="365" class="section" fill="#42c9e8">ACTORS</text>
  <text x="80" y="400" class="head">Player</text>
  <text x="80" y="425" class="body">Plays and gives input</text>
  <text x="80" y="455" class="head">Operator</text>
  <text x="80" y="478" class="body">Configures and supervises</text>

  <!-- Application boundary -->
  <rect x="330" y="135" width="790" height="580" rx="20" class="box"/>
  <text x="360" y="172" class="section">LOCAL BROWSER APPLICATION</text>
  <text x="840" y="172" class="small">Runs on the same device</text>

  <!-- Interfaces -->
  <rect x="365" y="205" width="325" height="100" rx="12" class="card"/>
  <text x="390" y="240" class="head">Player interface</text>
  <text x="390" y="269" class="body">Game view · score · round status</text>
  <text x="390" y="289" class="small">Keyboard or body-movement input</text>

  <rect x="760" y="205" width="325" height="100" rx="12" class="card"/>
  <text x="785" y="240" class="head">Operator interface</text>
  <text x="785" y="269" class="body">Camera setup · calibration · settings</text>
  <text x="785" y="289" class="small">Start · pause · restart · monitoring</text>

  <!-- Core services -->
  <rect x="365" y="350" width="325" height="125" rx="12" class="card"/>
  <text x="390" y="386" class="head">Game system</text>
  <text x="390" y="416" class="body">Game rules · movement · collisions</text>
  <text x="390" y="441" class="body">Round state · scoring · rewards</text>
  <text x="390" y="461" class="small">Updates the active game session</text>

  <rect x="760" y="350" width="325" height="125" rx="12" class="card"/>
  <text x="785" y="386" class="head">Movement control</text>
  <text x="785" y="416" class="body">Keyboard input or camera-based pose</text>
  <text x="785" y="441" class="body">Calibration · lane and action mapping</text>
  <text x="785" y="461" class="small">Camera processing stays on-device</text>

  <rect x="365" y="525" width="325" height="110" rx="12" class="card"/>
  <text x="390" y="560" class="head">Game presentation</text>
  <text x="390" y="590" class="body">3D scene · animated character</text>
  <text x="390" y="614" class="body">Sound and visual feedback</text>

  <rect x="760" y="525" width="325" height="110" rx="12" class="card"/>
  <text x="785" y="560" class="head">Local coordination</text>
  <text x="785" y="590" class="body">Shares controls, settings, and status</text>
  <text x="785" y="614" class="body">When using separate screens</text>

  <!-- External capabilities -->
  <rect x="55" y="165" width="225" height="105" rx="14" class="box"/>
  <text x="80" y="201" class="section" fill="#42c9e8">LOCAL HOSTING</text>
  <text x="80" y="232" class="head">Web server</text>
  <text x="80" y="254" class="small">Provides the browser application</text>

  <rect x="1160" y="185" width="205" height="105" rx="14" class="box"/>
  <text x="1183" y="220" class="section" fill="#aa8cff">OPTIONAL INPUT</text>
  <text x="1183" y="251" class="head">Camera</text>
  <text x="1183" y="274" class="small">Local video stream</text>

  <rect x="1160" y="365" width="205" height="105" rx="14" class="box"/>
  <text x="1183" y="400" class="section" fill="#66d6a0">OUTPUT</text>
  <text x="1183" y="431" class="head">Display + speakers</text>
  <text x="1183" y="454" class="small">Game visuals and audio</text>

  <rect x="1160" y="550" width="205" height="105" rx="14" class="box"/>
  <text x="1183" y="585" class="section" fill="#66d6a0">LOCAL DATA</text>
  <text x="1183" y="616" class="head">Browser storage</text>
  <text x="1183" y="639" class="small">Saved calibration settings</text>

  <!-- Flows -->
  <path d="M280 215H350" class="net"/>
  <path d="M280 400H315V255H350" class="line"/>
  <path d="M280 455H310V320H745V255H760" class="line"/>
  <path d="M527 305V338" class="line"/>
  <path d="M922 305V338" class="line"/>
  <path d="M760 430H700" class="motion"/>
  <path d="M527 475V513" class="line"/>
  <path d="M922 475V513" class="line"/>
  <path d="M690 575H1138V417H1145" class="out"/>
  <path d="M1150 238H1128V390H1095" class="motion"/>
  <path d="M1150 603H1128V622H1095" class="line"/>
  <path d="M280 450H315V250H350" class="line"/>

  <!-- Takeaway -->
  <rect x="330" y="755" width="1035" height="55" rx="12" fill="#10232c" stroke="#286071" stroke-width="1.2"/>
  <text x="355" y="789" class="body">No remote backend is required. Camera video and game processing remain on the local device.</text>
</svg>
