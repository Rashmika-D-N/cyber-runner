<!doctype html><title>Local worker test</title><p id="result">Starting local tracking worker…</p><script>
const result=document.getElementById('result');const worker=new Worker('./pose-worker.js');const timer=setTimeout(()=>{result.textContent='FAIL: timed out';worker.terminate()},45000);worker.onerror=e=>{clearTimeout(timer);result.textContent='FAIL: '+e.message};worker.onmessage=async({data:d})=>{if(d.type==='ready'){const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;canvas.getContext('2d').fillRect(0,0,640,360);const bitmap=await createImageBitmap(canvas);worker.postMessage({type:'frame',bitmap,timestamp:performance.now(),epoch:1},[bitmap]);}else{clearTimeout(timer);result.textContent=d.type==='pose'?'PASS: worker model initialized and processed transferred frame in '+Math.round(d.ms)+' ms. Blank frame correctly returns '+(d.points?.length||0)+' landmarks.':'FAIL: '+d.message;worker.terminate();}};worker.postMessage({type:'init'});
</script>
