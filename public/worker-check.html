<!doctype html><title>Local worker test</title><p id="result">Starting local tracking worker…</p>
<script>
const result = document.getElementById('result'), worker = new Worker('./pose-worker.js');
function finish(message) { clearTimeout(timer); result.textContent = message; worker.terminate(); }
const timer = setTimeout(() => finish('FAIL: timed out'), 45000);
worker.onerror = e => finish('FAIL: ' + e.message);
worker.onmessage = async ({data}) => {
  if (data.type === 'ready') {
    const canvas = document.createElement('canvas'); canvas.width = 640; canvas.height = 360;
    canvas.getContext('2d').fillRect(0, 0, 640, 360);
    const bitmap = await createImageBitmap(canvas);
    worker.postMessage({type: 'frame', bitmap, timestamp: performance.now(), epoch: 1}, [bitmap]);
  } else if (data.type === 'pose' && Array.isArray(data.poses) && data.poses.length === 0) {
    finish('PASS: local worker processed the blank frame in ' + Math.round(data.ms) + ' ms and returned zero players.');
  } else finish('FAIL: ' + (data.message || 'unexpected pose result'));
};
worker.postMessage({type: 'init'});
</script>
